<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Tokodiks</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>body{font-family:sans-serif;padding:12px;background:#fff7ed}h1{color:#dc2626;text-align:center}.card{background:#fff;padding:12px;border-radius:14px;margin-bottom:12px;display:flex;gap:10px;box-shadow:0 2px 8px #0001}img{width:90px;height:90px;object-fit:cover;border-radius:10px;background:#ddd}input{width:100%;padding:10px;margin:4px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}button{background:#dc2626;color:#fff;border:0;padding:10px;border-radius:10px;width:100%;font-weight:700}</style></head>
<body><h1>⚙️ ADMIN TOKO DIK'S</h1><p id="status" style="text-align:center">Menghubungkan ke Firebase...</p><div id="list"></div><button onclick="saveAll()" style="background:#ea580c;padding:14px">💾 SIMPAN SEMUA</button>
<script>
const firebaseConfig={apiKey:"AIzaSyAAqXyVRJnM3e513tqUzYZISp966tJxWNc",authDomain:"tokodiks.firebaseapp.com",projectId:"tokodiks",storageBucket:"tokodiks.firebasestorage.app",messagingSenderId:"346086365198",appId:"1:346086365198:web:36ef8fc9c107494a31445f"};
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();
let produk=[];
const def=[{nama:"Mie Instan",harga:3500,stok:20,img:"https://via.placeholder.com/200?text=Mie",kat:"Makanan"},{nama:"Kopi Sachet",harga:2000,stok:20,img:"https://via.placeholder.com/200?text=Kopi",kat:"Minuman"},{nama:"Rokok",harga:27000,stok:10,img:"https://via.placeholder.com/200?text=Rokok",kat:"Semua"}];
db.collection("toko").doc("produk").onSnapshot(doc=>{ if(doc.exists){produk=doc.data().list;} else {produk=def; db.collection("toko").doc("produk").set({list:def});} document.getElementById("status").innerText="✅ Terhubung ke Firebase - "+produk.length+" produk"; render();});
function render(){document.getElementById("list").innerHTML=produk.map((p,i)=>`<div class="card"><img src="${p.img}"><div style="flex:1"><b>${p.nama}</b><div>Harga: Rp ${p.harga.toLocaleString("id-ID")}</div><label>Ganti Harga</label><input type="number" value="${p.harga}" oninput="produk[${i}].harga=+this.value"><label>Ganti Foto (otomatis dikecilin)</label><input type="file" accept="image/*" onchange="upFoto(event,${i})"><button onclick="saveOne(${i})">SIMPAN</button></div></div>`).join("");}
function upFoto(e,i){
  let file=e.target.files[0]; if(!file) return;
  let r=new FileReader();
  r.onload=ev=>{
    let img=new Image(); img.onload=()=>{
      let c=document.createElement("canvas"); let max=400; let w=img.width, h=img.height;
      if(w>h){ if(w>max){h=h*max/w; w=max;} } else { if(h>max){w=w*max/h; h=max;} }
      c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h);
      produk[i].img=c.toDataURL("image/jpeg",0.7);
      render(); alert("Foto udah dikecilin & preview berubah! Sekarang klik SIMPAN ya bro!");
    }; img.src=ev.target.result;
  }; r.readAsDataURL(file);
}
async function saveOne(i){document.getElementById("status").innerText="Menyimpan..."; await db.collection("toko").doc("produk").set({list:produk}); alert("BERHASIL! "+produk[i].nama+" foto + harga udah berubah!");}
async function saveAll(){await db.collection("toko").doc("produk").set({list:produk}); alert("BERHASIL SEMUA!");}
</script></body></html>
