<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin TOKO DIK'S</title>
<style>
*{box-sizing:border-box;font-family:Arial}body{background:#f5f5f5;margin:0;padding:12px}.wrap{max-width:520px;margin:0 auto}
input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px;font-size:14px;background:#fff}
button{padding:12px;border:0;border-radius:10px;font-weight:800;cursor:pointer;width:100%}
.card{background:#fff;padding:14px;border-radius:14px;margin-bottom:12px}
.chip{display:inline-block;background:#eee;padding:6px 10px;border-radius:20px;margin:3px;font-size:12px}
.item{display:flex;gap:10px;border-bottom:1px solid #eee;padding:12px 0}.item img{width:70px;height:70px;object-fit:cover;border-radius:10px;background:#ddd}.item .isi{flex:1}
.btn-kecil{width:auto!important;padding:8px 10px!important;font-size:12px}
</style></head><body><div class="wrap">

<div id="loginBox" style="max-width:360px;margin:60px auto;background:#fff;padding:24px;border-radius:16px;text-align:center">
<h2>🔒 LOGIN ADMIN</h2><p style="color:#888;font-size:13px">Hanya Pemilik Toko Dik's</p>
<input id="user" placeholder="Username"><input id="pass" type="password" placeholder="Password">
<button onclick="loginAdmin()" style="background:#dc2626;color:#fff">MASUK</button>
<p id="pesanLogin" style="color:red;font-size:13px"></p></div>

<div id="isiAdmin" style="display:none">
<h2 style="display:flex;justify-content:space-between;align-items:center">👋 Halo Bos Diks! <button onclick="logoutAdmin()" style="width:auto;background:#111;color:#fff">Logout</button></h2>

<div class="card"><h3 style="margin:0 0 8px">➕ Tambah Kategori Baru</h3>
<input id="katBaru" placeholder="Contoh: Sembako, Rokok, Jajanan">
<button onclick="tambahKat()" style="background:#111;color:#fff">+ Tambah Kategori</button>
<div id="listKat" style="margin-top:10px"></div></div>

<div class="card"><h3 style="margin:0 0 8px">➕ Tambah Barang + Varian</h3>
<input id="namaBaru" placeholder="Nama Barang, contoh: Mie Goreng">
<input id="hargaBaru" type="number" placeholder="Harga, contoh: 3500">
<input id="varianBaru" placeholder="Varian, contoh: Original, Pedas (pisah koma)">
<select id="katPilih"></select>
<input id="fotoBaru" placeholder="Link Foto (opsional)">
<button onclick="tambahBarang()" style="background:#dc2626;color:#fff">SIMPAN BARANG</button></div>

<div class="card"><h3 style="margin:0 0 8px">📦 Daftar Barang - Bisa Edit Harga & Foto</h3><div id="listBarang"></div></div>
</div></div>

<script>
const USERNAME_BENAR="diks"; const PASSWORD_BENAR="diks12345";
if(localStorage.getItem("loginAdminDiks")==="iya"){document.getElementById("loginBox").style.display="none";document.getElementById("isiAdmin").style.display="block";}
function loginAdmin(){let u=document.getElementById("user").value;let p=document.getElementById("pass").value;if(u===USERNAME_BENAR&&p===PASSWORD_BENAR){localStorage.setItem("loginAdminDiks","iya");document.getElementById("loginBox").style.display="none";document.getElementById("isiAdmin").style.display="block";}else{document.getElementById("pesanLogin").innerText="Username / Password salah!";}}
function logoutAdmin(){localStorage.removeItem("loginAdminDiks");location.reload();}

// BARANG AWAL - SAMA KAYAK DI TOKO
let barangAwal=[
 {nama:"Mie Instan",harga:2000,kat:"Makanan",varian:"",img:"https://via.placeholder.com/70?text=Mie"},
 {nama:"Kopi Sachet",harga:4000,kat:"Minuman",varian:"",img:"https://via.placeholder.com/70?text=Kopi"},
 {nama:"Rokok",harga:27000,kat:"Rokok",varian:"",img:"https://via.placeholder.com/70?text=Rokok"},
];
let produk=JSON.parse(localStorage.getItem("produkDiks")||"null");
if(!produk){produk=barangAwal;localStorage.setItem("produkDiks",JSON.stringify(produk));}
let kategori=JSON.parse(localStorage.getItem("katDiks")||'["Semua","Makanan","Minuman","Rokok","Sembako"]');
function simpan(){localStorage.setItem("produkDiks",JSON.stringify(produk));localStorage.setItem("katDiks",JSON.stringify(kategori));tampil();}
function tambahKat(){let k=document.getElementById("katBaru").value.trim();if(!k)return alert("Isi dulu");if(!kategori.includes(k))kategori.push(k);document.getElementById("katBaru").value="";simpan();}
function tambahBarang(){let n=document.getElementById("namaBaru").value.trim();let h=parseInt(document.getElementById("hargaBaru").value);let v=document.getElementById("varianBaru").value;let k=document.getElementById("katPilih").value;let f=document.getElementById("fotoBaru").value||"https://via.placeholder.com/70?text="+encodeURIComponent(n);if(!n||!h)return alert("Nama + Harga wajib");produk.push({nama:n,harga:h,kat:k,varian:v,img:f});document.getElementById("namaBaru").value="";document.getElementById("hargaBaru").value="";document.getElementById("varianBaru").value="";simpan();alert("Barang ditambah! Cek di toko!");}
function gantiHarga(i,val){produk[i].harga=parseInt(val)||0;simpan();}
function hapusBarang(i){if(confirm("Hapus "+produk[i].nama+"?")){produk.splice(i,1);simpan();}}
function gantiFoto(i,input){
 let file=input.files[0];if(!file)return;
 let reader=new FileReader();
 reader.onload=function(e){let img=new Image();img.onload=function(){let c=document.createElement("canvas");let max=300;let w=img.width,h=img.height;if(w>max){h=h*w/max;w=max;}c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);produk[i].img=c.toDataURL("image/jpeg",0.8);simpan();alert("Foto keganti!");};img.src=e.target.result;};
 reader.readAsDataURL(file);
}
function tampil(){
 let kHtml="";kategori.forEach(k=>{kHtml+=`<span class="chip">${k}</span>`});document.getElementById("listKat").innerHTML=kHtml;
 let s="";kategori.forEach(k=>{if(k!=="Semua")s+=`<option>${k}</option>`});document.getElementById("katPilih").innerHTML=s;
 let h="";produk.forEach((p,i)=>{
  h+=`<div class="item"><img src="${p.img}"><div class="isi"><b>${p.nama}</b><br><small>${p.kat} | ${p.varian||"-"} | Rp ${p.harga.toLocaleString('id-ID')}</small><br>
  <label style="font-size:12px">Ganti Harga</label><input type="number" value="${p.harga}" onchange="gantiHarga(${i},this.value)" style="padding:8px">
  <label style="font-size:12px">Ganti Foto (otomatis dikecilin)</label><input type="file" accept="image/*" onchange="gantiFoto(${i},this)">
  <button class="btn-kecil" onclick="hapusBarang(${i})" style="background:#fee;color:#dc2626">🗑️ Hapus Barang Ini</button>
  </div></div>`;
 });
 document.getElementById("listBarang").innerHTML=h||"Belum ada barang";
}
tampil();
</script></body></html>
