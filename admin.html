<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin TOKO DIK'S</title><style>*{box-sizing:border-box;font-family:Arial}body{background:#f5f5f5;padding:12px}input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px}button{padding:12px;border:0;border-radius:10px;font-weight:800} .card{background:#fff;padding:12px;border-radius:12px;margin-bottom:10px}</style></head><body>

<div id="loginBox" style="max-width:360px;margin:60px auto;background:#fff;padding:24px;border-radius:16px;text-align:center">
<h2>🔒 LOGIN ADMIN</h2><p style="color:#888;font-size:13px">Hanya Pemilik Toko Dik's</p>
<input id="user" placeholder="Username"><input id="pass" type="password" placeholder="Password">
<button onclick="loginAdmin()" style="width:100%;background:#dc2626;color:#fff">MASUK</button>
<p id="pesanLogin" style="color:red;font-size:13px"></p></div>

<div id="isiAdmin" style="display:none">
<h2>👋 Halo Bos Diks! <button onclick="logoutAdmin()" style="background:#111;color:#fff;float:right">Logout</button></h2>

<div class="card"><h3>➕ Tambah Kategori Baru</h3>
<input id="katBaru" placeholder="Contoh: Sembako, Rokok, Jajanan">
<button onclick="tambahKat()" style="background:#111;color:#fff;width:100%">+ Tambah Kategori</button>
<div id="listKat"></div></div>

<div class="card"><h3>➕ Tambah Barang + Varian</h3>
<input id="namaBaru" placeholder="Nama Barang, contoh: Mie Goreng">
<input id="hargaBaru" type="number" placeholder="Harga, contoh: 3500">
<input id="varianBaru" placeholder="Varian, contoh: Original, Pedas, Soto (pisah koma)">
<select id="katPilih"></select>
<input id="fotoBaru" placeholder="Link Foto (opsional)">
<button onclick="tambahBarang()" style="background:#dc2626;color:#fff;width:100%">SIMPAN BARANG</button></div>

<div class="card"><h3>📦 Daftar Barang</h3><div id="listBarang"></div></div>
<p style="text-align:center;font-size:12px;color:#888">Semua tersimpan di HP ini. Buka toko di HP yang sama biar muncul.</p>
</div>

<script>
const USERNAME_BENAR="diks"; const PASSWORD_BENAR="diks12345";
if(localStorage.getItem("loginAdminDiks")==="iya"){document.getElementById("loginBox").style.display="none";document.getElementById("isiAdmin").style.display="block";}
function loginAdmin(){let u=document.getElementById("user").value;let p=document.getElementById("pass").value;if(u===USERNAME_BENAR&&p===PASSWORD_BENAR){localStorage.setItem("loginAdminDiks","iya");document.getElementById("loginBox").style.display="none";document.getElementById("isiAdmin").style.display="block";}else{document.getElementById("pesanLogin").innerText="Username / Password salah!";}}
function logoutAdmin(){localStorage.removeItem("loginAdminDiks");location.reload();}
let produk=JSON.parse(localStorage.getItem("produkDiks")||"[]");
let kategori=JSON.parse(localStorage.getItem("katDiks")||'["Semua","Makanan","Minuman","Rokok","Sembako"]');
function simpan(){localStorage.setItem("produkDiks",JSON.stringify(produk));localStorage.setItem("katDiks",JSON.stringify(kategori));tampil();}
function tambahKat(){let k=document.getElementById("katBaru").value.trim();if(!k)return alert("Isi dulu kategorinya");if(!kategori.includes(k))kategori.push(k);document.getElementById("katBaru").value="";simpan();}
function tambahBarang(){let n=document.getElementById("namaBaru").value.trim();let h=parseInt(document.getElementById("hargaBaru").value);let v=document.getElementById("varianBaru").value;let k=document.getElementById("katPilih").value;let f=document.getElementById("fotoBaru").value||"https://via.placeholder.com/70?text="+encodeURIComponent(n);if(!n||!h)return alert("Nama + Harga wajib diisi");produk.push({nama:n,harga:h,kat:k,varian:v,img:f});document.getElementById("namaBaru").value="";document.getElementById("hargaBaru").value="";document.getElementById("varianBaru").value="";simpan();alert("Barang ditambah!");}
function hapusBarang(i){if(confirm("Hapus barang ini?")){produk.splice(i,1);simpan();}}
function tampil(){let kHtml="";kategori.forEach(k=>{kHtml+=`<span style="display:inline-block;background:#eee;padding:6px 10px;border-radius:20px;margin:3px;font-size:12px">${k}</span>`});document.getElementById("listKat").innerHTML=kHtml;let s="";kategori.forEach(k=>{if(k!=="Semua")s+=`<option>${k}</option>`});document.getElementById("katPilih").innerHTML=s;let h="";produk.forEach((p,i)=>{h+=`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:8px 0"><span><b>${p.nama}</b><br><small>${p.kat} | ${p.varian||"-"} | Rp ${p.harga.toLocaleString('id-ID')}</small></span><button onclick="hapusBarang(${i})" style="background:#fee;color:#dc2626">Hapus</button></div>`});document.getElementById("listBarang").innerHTML=h||"Belum ada barang";}
tampil();
</script></body></html>
