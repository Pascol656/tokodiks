<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toko Dik's - Serba Ada</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#dc2626">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/263/263115.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}body{font-family:sans-serif;margin:0;background:#fff7ed;padding-bottom:120px}
header{background:#dc2626;color:#fff;padding:16px;text-align:center;position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:22px}header p{margin:4px 0 0;font-size:13px;opacity:.9}
#installBtn{display:none;background:#111;color:#fff;border:0;padding:12px 16px;border-radius:999px;font-weight:700;width:calc(100% - 24px);margin:12px auto 0}
.wrap{padding:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.card img{width:100%;height:130px;object-fit:cover;background:#eee}
.card .info{padding:10px}
.card b{font-size:14px;display:block;min-height:34px}
.card .harga{color:#dc2626;font-weight:800;margin:6px 0}
.card button{width:100%;background:#dc2626;color:#fff;border:0;padding:9px;border-radius:10px;font-weight:700}
#cartBar{position:fixed;bottom:0;left:0;right:0;background:#111;color:#fff;padding:14px;display:flex;justify-content:space-between;align-items:center}
#cartBar button{background:#22c55e;color:#fff;border:0;padding:10px 16px;border-radius:10px;font-weight:800}
#search{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin-bottom:12px}
</style>
</head>
<body>
<header><h1>🛒 TOKO DIK'S</h1><p>Serba Ada - Cepat Diantar - Tasikmalaya</p><button id="installBtn">⬇️ INSTALL APLIKASI TOKO DIK'S</button></header>
<div class="wrap"><input id="search" placeholder="Cari Mie, Kopi, Rokok, Gas..." oninput="render()"><div id="grid" class="grid"></div><p style="text-align:center;color:#888;font-size:12px">Mau order? Pilih barang, klik Pesan via WA</p></div>
<div id="cartBar"><span id="cartText">🛒 Keranjang: 0 barang</span><button onclick="checkout()">Pesan via WA</button></div>
<script>
const firebaseConfig={apiKey:"AIzaSyAAqXyVRJnM3e513tqUzYZISp966tJxWNc",authDomain:"tokodiks.firebaseapp.com",projectId:"tokodiks",storageBucket:"tokodiks.firebasestorage.app",messagingSenderId:"346086365198",appId:"1:346086365198:web:36ef8fc9c107494a31445f"};
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();
let produk=[
{nama:"Mie Instan",harga:2000,img:"https://via.placeholder.com/400x300?text=Mie"},
{nama:"Kopi",harga:4000,img:"https://via.placeholder.com/400x300?text=Kopi"},
{nama:"Rokok",harga:27000,img:"https://via.placeholder.com/400x300?text=Rokok"},
{nama:"Gas LPG 3Kg",harga:25000,img:"https://via.placeholder.com/400x300?text=Gas"},
{nama:"Galon Air",harga:20000,img:"https://via.placeholder.com/400x300?text=Galon"},
{nama:"Beras 5Kg",harga:65000,img:"https://via.placeholder.com/400x300?text=Beras"}
];
let cart={};
db.collection("toko").doc("produk").onSnapshot(doc=>{ if(doc.exists && doc.data().list){ produk=doc.data().list; } render(); });
function render(){
 let q=document.getElementById("search").value.toLowerCase();
 let list=produk.filter(p=>p.nama.toLowerCase().includes(q));
 document.getElementById("grid").innerHTML=list.map((p,i)=>{
  let idx=produk.indexOf(p);
  return `<div class="card"><img src="${p.img}"><div class="info"><b>${p.nama}</b><div class="harga">Rp ${p.harga.toLocaleString("id-ID")}</div><button onclick="add(${idx})">+ Tambah</button></div></div>`;
 }).join("");
 let totalQty=Object.values(cart).reduce((a,b)=>a+b,0);
 document.getElementById("cartText").innerText="🛒 Keranjang: "+totalQty+" barang";
}
function add(i){ cart[i]=(cart[i]||0)+1; render(); alert(produk[i].nama+" ditambah!"); }
function checkout(){
 let keys=Object.keys(cart); if(keys.length==0){ alert("Keranjang masih kosong!"); return; }
 let pesan="Halo Toko Dik's, saya mau pesan:%0A"; let total=0;
 keys.forEach(k=>{ let p=produk[k]; let qty=cart[k]; let sub=p.harga*qty; total+=sub; pesan+=`- ${p.nama} x${qty} = Rp ${sub.toLocaleString("id-ID")}%0A`; });
 pesan+=`Total: Rp ${total.toLocaleString("id-ID")}`;
 window.open("https://wa.me/+6282118115124?text="+pesan,"_blank");
}
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",(e)=>{ e.preventDefault(); deferredPrompt=e; document.getElementById("installBtn").style.display="block"; });
document.getElementById("installBtn").onclick=async()=>{ if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; document.getElementById("installBtn").style.display="none"; } else { alert("Di HP: Klik titik 3 di Chrome > Tambahkan ke Layar Utama"); } };
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
render();
</script>
</body>
</html>
